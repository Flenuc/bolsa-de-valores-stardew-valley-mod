name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    # Solo se compila y testea la lógica (Core). El proyecto del mod necesita el juego instalado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Test
        run: dotnet test tests/ZuzuMarket.Core.Tests --configuration Release
